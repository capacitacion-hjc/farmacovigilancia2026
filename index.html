<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>2° Curso de Farmacología</title>

    <link rel="icon" href="img/LOGOautorizado2010.png" type="image/gif" sizes="16x16">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <div class="container py-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">

                <div class="text-center mb-4">

                    <img src="img/logo_hospital.png" alt="Logo Institucional" class="img-fluid"
                        style="max-height:120px;">

                </div>

                <h1>Hospital Juárez del Centro</h1>
                <h2>"Centro Institucional de Farmacovigilancia"</h2>
                <h2>2° Curso de Farmacología</h2><br>

                <h3>Registro de Participantes</h4>
                    <h6>(Modalidad, solo presencial)</h6>




            </div>

            <div class="card-body">

                Completa el siguiente formulario todos los campos son obligatorios.
                <br> <br>
                <form id="registroForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Nombre Completo
                        </label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Sexo
                        </label>
                        <select id="sexo" class="form-select" required>

                            <option value="">
                                Seleccione
                            </option>

                            <option>Mujer</option>
                            <option>Hombre</option>
                            <option>Otro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Entidad Federativa
                        </label>

                        <select id="estado" class="form-select" required>

                            <option value="">
                                Seleccione
                            </option>

                            <option>Aguascalientes</option>
                            <option>Baja California</option>
                            <option>Baja California Sur</option>
                            <option>Campeche</option>
                            <option>Chiapas</option>
                            <option>Chihuahua</option>
                            <option>Ciudad de México</option>
                            <option>Coahuila</option>
                            <option>Colima</option>
                            <option>Durango</option>
                            <option>Estado de México</option>
                            <option>Guanajuato</option>
                            <option>Guerrero</option>
                            <option>Hidalgo</option>
                            <option>Jalisco</option>
                            <option>Michoacán</option>
                            <option>Morelos</option>
                            <option>Nayarit</option>
                            <option>Nuevo León</option>
                            <option>Oaxaca</option>
                            <option>Puebla</option>
                            <option>Querétaro</option>
                            <option>Quintana Roo</option>
                            <option>San Luis Potosí</option>
                            <option>Sinaloa</option>
                            <option>Sonora</option>
                            <option>Tabasco</option>
                            <option>Tamaulipas</option>
                            <option>Tlaxcala</option>
                            <option>Veracruz</option>
                            <option>Yucatán</option>
                            <option>Zacatecas</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Unidad o Institución de Procedencia
                        </label>

                        <input type="text" id="institucion" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Correo Institucional ó Personal
                        </label>

                        <input type="email" id="correo" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Profesión
                        </label>

                        <select id="profesion" class="form-select" required>

                            <option value="">
                                Seleccione
                            </option>

                            <option>Médico</option>
                            <option>Enfermería</option>
                            <option>Químico</option>
                            <option>Estudiante</option>
                            <option>Pasante</option>
                            <option>Otro</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Grado académico
                        </label>

                        <select id="gradoAcademico" class="form-select" required>

                            <option value="">
                                Seleccione
                            </option>

                            <option>Técnico</option>
                            <option>Licenciatura</option>
                            <option>Posgrado</option>
                            <option>Maestría</option>
                            <option>Doctorado</option>
                        </select>
                    </div>

                    <!--
                    <div class="card border-primary mb-3">
                        <div class="card-body">

                            <label class="form-label fw-bold">
                                Modalidad de Participación
                            </label>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="modalidad" value="Presencial"
                                    required>

                                <label class="form-check-label">
                                    Presencial
                                </label>
                            </div>


                        </div>
                    </div>
                -->

                    <br>
                    <div class="form-check mb-3">                        

                        <label class="form-check-label">
                            <input type="checkbox"  required>
                            Confirmo que he leído el Aviso de Privacidad y doy mi consentimiento informado para el uso
                            de mis datos personales conforme a las finalidades del 2° Curso de Farmacología del Hospital
                            Juárez del Centro.

                        </label>

                    </div>

                    <br>
                    <div id="resultado" class="mt-4"></div>

                    <button id = "btnRegistrar" type="submit" class="btn btn-primary w-100">

                        Enviar Registro

                    </button>

                </form>




            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

    <div id="loader" class="loader-overlay d-none">

        <div class="text-center">

            <div class="spinner-border text-primary" role="status" style="width:4rem;height:4rem;">
            </div>

            <div class="mt-3">
                <strong>Registrando información...</strong>
            </div>

            <small class="text-muted">
                Espere un momento por favor.
            </small>

        </div>

    </div>

</body>

</html>
