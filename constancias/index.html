<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../img/LOGOautorizado2010.png" type="image/gif" sizes="16x16">
<title>Descarga de Constancias | Hospital Juárez del Centro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card shadow-lg mt-5">

        <div class="card-body">

            <div class="text-center">

<img src="../img/logo_hospital.png" alt="Logo Institucional" class="img-fluid"
                        style="max-height:120px;">
						
                <h2 class="mt-3">
                    Descarga de Constancias
                </h2>

                <h5>
                    2.º Curso de Farmacología
                </h5>

                <hr>

            </div>

            <div class="alert alert-info">

                Capture el correo electrónico con el que realizó su registro.

            </div>

            <form id="buscarForm">

                <div class="mb-3">

                    <label class="form-label">

                        Correo electrónico

                    </label>

                    <input
                        id="correo"
                        type="email"
                        class="form-control form-control-lg"
                        required>

                </div>

                <div class="d-grid">

                    <button
                        class="btn btn-primary btn-lg">

                        <i class="bi bi-search"></i>

                        Buscar constancia

                    </button>

                </div>

            </form>

            <div id="loader" class="text-center mt-4" style="display:none;">

                <div class="spinner-border text-primary" role="status"></div>
            
                <p class="mt-3 mb-0">
                    Buscando su constancia, por favor espere...
                </p>
            
            </div>

            <div id="resultado" class="mt-4"></div>

        </div>

    </div>

    <footer class="text-center py-4">

        <small class="text-muted">

            Descarga de Constancias v1.0

            <br>

            Desarrollo e implementación:
            <b>Ing. Eduardo Javier Pérez Galván</b>

        </small>

    </footer>

</div>

<script src="app.js"></script>

</body>

</html>
